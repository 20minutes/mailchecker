# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  push:
    branches: [ master, more-emails ]
  pull_request:
    branches: [ master, more-emails ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci
      
      - name: Test
        run: npm test

      - name: Check generated Node.js module is committed
        run: git diff --exit-code -- platform/node/index.js
