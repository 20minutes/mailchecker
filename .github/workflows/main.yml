name: CI

on:
  push:
    branches: [ master, more-emails ]
  pull_request:
    branches: [ master, more-emails ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install
        run: yarn install --no-progress --frozen-lockfile
      
      - name: Lint
        run: yarn lint:ci

      - name: Test
        run: yarn test

      - name: Check generated Node.js module is committed
        run: git diff --exit-code -- platform/node/index.js
